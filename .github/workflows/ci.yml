name: Continuous Integration

on:
  push:
    branches: [main, master, dev, develop]
  pull_request:
    branches: [main, master, dev, develop]

jobs:
  # Job 1: Frontend validation
  frontend-ci:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js v26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Build client production assets
        run: npm run build

  # Job 2: Backend validation
  backend-ci:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # Redis service container for django-channels Websocket tests
    services:
      redis:
        image: redis:7.2.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python v3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify migrations are up-to-date
        env:
          USE_POSTGRES: "0"
          DJANGO_SECRET_KEY: "ci-secret-key-for-migrations-check"
          DEBUG: "True"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run server test suite
        env:
          USE_POSTGRES: "0"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          DJANGO_SECRET_KEY: "ci-secret-key-for-testing-only"
          DEBUG: "True"
        run: |
          python manage.py test

  # Job 3: End-to-End validation
  end-to-end:
    name: End-to-End (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Install Playwright Browsers
        run: cd client && npx playwright install --with-deps

      - name: Start Dev Stack
        run: make dev-up

      - name: Run E2E Tests
        run: make client-test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 14
