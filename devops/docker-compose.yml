# Quizscendence Orchestration
# Compose Reference: https://docs.docker.com/compose/compose-file/
# Networking Guide: https://docs.docker.com/compose/networking/

services:
  db:
    image: postgres:15.6-alpine3.19
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ../.env
    ports:
      - "${DB_EXPOSED_PORT:-5432}:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7.2.4-alpine3.19
    ports:
      - "${REDIS_EXPOSED_PORT:-6379}:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  api:
    build:
      context: ..
      dockerfile: devops/django/Dockerfile
    volumes:
      - media_data:/app/media
      - static_data:/app/static
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: always

  web:
    build:
      context: ..
      dockerfile: devops/react/Dockerfile
    networks:
      - frontend
    restart: always

  proxy:
    build:
      context: ..
      dockerfile: devops/nginx/Dockerfile
    env_file:
      - ../.env
    ports:
      - "${HTTP_EXPOSED_PORT:-8080}:80"
      - "${HTTPS_EXPOSED_PORT:-8443}:443"
    volumes:
      - static_data:/app/static:ro
      - media_data:/app/media:ro
    depends_on:
      - api
      - web
    networks:
      - frontend
      - backend
    restart: always

networks:
  frontend:
  backend:

volumes:
  postgres_data:
  static_data:
  media_data:
